# =====================================================================
# Compound Action: vm_delete
# Input args:  requester_email (string)  <- meta_info.user.email_addr
#              hostname (string)         <- data.vm_hostname
# Called from: delete_my_vm, Activity 2 (Fire and Forget, Confirmation Policy ON)
#
# Checks the VM belongs to the caller (admins can delete any), removes its row
# from the stack's list, triggers a Spacelift run that destroys it, polls, and
# confirms in chat. Change the stack ID, account and admins where marked CONFIG.
# =====================================================================
steps:
  - action:
      action_name: mw.batch_get_users_by_email
      output_key: people
      input_args:
        user_emails:
          - data.requester_email

  - action:
      action_name: spacelift_get_token
      output_key: token

  - action:
      action_name: spacelift_get_stack
      output_key: stack_before
      input_args:
        jwt: data.token.data.apiKeyUser.jwt
        stack_id: '"vm-provisioner"'              # CONFIG

  # Ownership check + remove the row
  - script:
      output_key: plan
      input_args:
        requester_email: data.requester_email
        hostname: data.hostname
        config: data.stack_before.data.stack.config
      code: |
        ADMINS = ["aryaman.chakravarty@cprime.com"]   # CONFIG: these people can delete any VM
        me = str(requester_email or "").lower()
        target = str(hostname or "").strip().lower()

        current = "none"
        for c in (config or []):
            if c.get("id") == "TF_VAR_vm_requests":
                current = str(c.get("value") or "none")

        keep = []
        found = None
        for r in current.split(";"):
            f = r.split("|")
            if len(f) < 10:
                continue
            if f[7].lower() == target or f[0].lower() == target:
                found = f
            else:
                keep.append(r)

        if found is None:
            status = "NOT_FOUND"
            msg = "I couldn't find a VM called " + str(hostname) + ". Say \"show my VMs\" to see yours."
            new_list = current
        elif found[9].lower() != me and me not in ADMINS:
            status = "NOT_OWNER"
            msg = found[7] + " belongs to someone else, so I can't delete it for you. Ask its owner or IT."
            new_list = current
        else:
            status = "OK"
            msg = "Deleting " + found[7] + " (" + found[1] + ", request " + found[0] + ")..."
            new_list = ";".join(keep) if len(keep) > 0 else "none"

        {"status": status, "message": msg, "vm_requests": new_list,
         "hostname": found[7] if found else str(hostname), "request_id": found[0] if found else ""}

  - switch:
      cases:
        - condition: data.plan.status != "OK"
          steps:
            - action:
                action_name: mw.batch_send_plaintext_chat_notification
                output_key: notify_refused
                input_args:
                  notifications:
                    - user_record_id: data.people.user_records[0].user.record_id
                      message: data.plan.message
            - return:
                output_mapper:
                  status: data.plan.status

  - action:
      action_name: spacelift_apply_requests
      output_key: trigger
      input_args:
        jwt: data.token.data.apiKeyUser.jwt
        stack_id: '"vm-provisioner"'              # CONFIG
        vm_requests: data.plan.vm_requests

  - script:
      output_key: run_info
      input_args:
        run_id: data.trigger.data.run.id
        hostname: data.plan.hostname
      code: |
        run_url = "https://aryaman20031411.app.spacelift.io/stack/vm-provisioner/run/" + str(run_id)   # CONFIG
        {
          "run_id": run_id,
          "run_url": run_url,
          "msg_running": "Deleting " + str(hostname) + ". Terraform is destroying it in Spacelift: " + run_url,
          "msg_done": str(hostname) + " has been deleted and its resources released. Run: " + run_url,
          "msg_failed": "The delete run for " + str(hostname) + " did not finish. Check it here: " + run_url,
          "polls": [i for i in range(30)],
        }

  - action:
      action_name: mw.batch_send_plaintext_chat_notification
      output_key: notify_running
      input_args:
        notifications:
          - user_record_id: data.people.user_records[0].user.record_id
            message: data.run_info.msg_running

  - for:
      each: poll
      index: poll_index
      in: data.run_info.polls
      output_key: poll_results
      steps:
        - action:
            action_name: spacelift_get_run
            output_key: run_status
            delay_config:
              seconds: "20"
            input_args:
              jwt: data.token.data.apiKeyUser.jwt
              stack_id: '"vm-provisioner"'          # CONFIG
              run_id: data.run_info.run_id
        - switch:
            cases:
              - condition: data.run_status.data.stack.run.state == "FINISHED"
                steps:
                  - action:
                      action_name: mw.batch_send_plaintext_chat_notification
                      output_key: notify_done
                      input_args:
                        notifications:
                          - user_record_id: data.people.user_records[0].user.record_id
                            message: data.run_info.msg_done
                  - return:
                      output_mapper:
                        state: '"FINISHED"'
              - condition: data.run_status.data.stack.run.state == "FAILED" OR data.run_status.data.stack.run.state == "STOPPED" OR data.run_status.data.stack.run.state == "DISCARDED" OR data.run_status.data.stack.run.state == "CANCELED"
                steps:
                  - action:
                      action_name: mw.batch_send_plaintext_chat_notification
                      output_key: notify_failed
                      input_args:
                        notifications:
                          - user_record_id: data.people.user_records[0].user.record_id
                            message: data.run_info.msg_failed
                  - return:
                      output_mapper:
                        state: data.run_status.data.stack.run.state

  - return:
      output_mapper:
        status: '"SUBMITTED"'
        hostname: data.plan.hostname
        run_url: data.run_info.run_url
