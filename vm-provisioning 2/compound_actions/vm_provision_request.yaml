# =====================================================================
# Compound Action: vm_provision_request
# Input args:  request (object)   <- data.evaluation   (output of vm_evaluate_request)
# Called from: request_vm, Activity 3 (Fire and Forget, Confirmation Policy ON)
#
# Flow: look up users -> approval if needed -> read the stack's VM list ->
# add this VM -> trigger a Spacelift run -> poll every 20 s (up to 10 min) ->
# send the user the VM's details from Terraform's vm_inventory output.
# =====================================================================
steps:
  - action:
      action_name: mw.batch_get_users_by_email
      output_key: people
      input_args:
        user_emails:
          - data.request.requester_email   # user_records[0]
          - data.request.approver_email    # user_records[1]

  # ---------- routing ----------
  - switch:
      cases:
        - condition: data.request.route == "BLOCKED"
          steps:
            - action:
                action_name: mw.batch_send_plaintext_chat_notification
                output_key: notify_blocked
                input_args:
                  notifications:
                    - user_record_id: data.people.user_records[0].user.record_id
                      message: data.request.msg_blocked
            - return:
                output_mapper:
                  request_id: data.request.request_id
                  status: '"BLOCKED"'

        - condition: data.request.route == "APPROVAL"
          steps:
            - action:
                action_name: mw.create_generic_approval_request
                output_key: approval
                input_args:
                  title: data.request.approval_title
                  approval_details: data.request.approval_details
                  approvers:
                    - data.people.user_records[1].user
                  # To route to the requester's manager instead, remove
                  # `approvers` above and use:  approval_key: '"MANAGER"'
                  users_requested_for:
                    - data.people.user_records[0].user
                progress_updates:
                  on_pending: Waiting for approval of your VM request...
                  on_complete: Your VM request has an approval decision.
            - switch:
                cases:
                  - condition: data.approval.status == "DENIED"
                    steps:
                      - action:
                          action_name: mw.batch_send_plaintext_chat_notification
                          output_key: notify_denied
                          input_args:
                            notifications:
                              - user_record_id: data.people.user_records[0].user.record_id
                                message: data.request.msg_denied
                      - return:
                          output_mapper:
                            request_id: data.request.request_id
                            status: '"DENIED"'

  - action:
      action_name: mw.batch_send_plaintext_chat_notification
      output_key: notify_started
      input_args:
        notifications:
          - user_record_id: data.people.user_records[0].user.record_id
            message: data.request.msg_started

  # ---------- Spacelift: add this VM to the stack's list and run ----------
  - action:
      action_name: spacelift_get_token
      output_key: token

  - action:
      action_name: spacelift_get_stack
      output_key: stack_before
      input_args:
        jwt: data.token.data.apiKeyUser.jwt
        stack_id: data.request.spacelift_stack

  - script:
      output_key: merged
      input_args:
        config: data.stack_before.data.stack.config
        new_row: data.request.request_row
        request_id: data.request.request_id
      code: |
        current = "none"
        for c in (config or []):
            if c.get("id") == "TF_VAR_vm_requests":
                current = str(c.get("value") or "none")
        rows = []
        for r in current.split(";"):
            if len(r.split("|")) >= 10 and r.split("|")[0] != request_id:
                rows.append(r)
        rows.append(new_row)
        {"vm_requests": ";".join(rows), "vm_count": len(rows)}

  - action:
      action_name: spacelift_apply_requests
      output_key: trigger
      input_args:
        jwt: data.token.data.apiKeyUser.jwt
        stack_id: data.request.spacelift_stack
        vm_requests: data.merged.vm_requests

  - script:
      output_key: run_info
      input_args:
        run_id: data.trigger.data.run.id
        stack_url: data.request.spacelift_stack_url
        request_id: data.request.request_id
      code: |
        run_url = str(stack_url) + "/run/" + str(run_id)
        {
          "run_id": run_id,
          "run_url": run_url,
          "msg_running": "Request " + str(request_id) + ": Terraform is running in Spacelift. Watch it live: " + run_url,
          "polls": [i for i in range(30)],
        }

  - action:
      action_name: mw.batch_send_plaintext_chat_notification
      output_key: notify_running
      input_args:
        notifications:
          - user_record_id: data.people.user_records[0].user.record_id
            message: data.run_info.msg_running

  # ---------- poll every 20 s, up to 10 min. `return` inside `for` exits the loop. ----------
  - for:
      each: poll
      index: poll_index
      in: data.run_info.polls
      output_key: poll_results
      steps:
        - action:
            action_name: spacelift_get_run
            output_key: run_status
            delay_config:
              seconds: "20"
            input_args:
              jwt: data.token.data.apiKeyUser.jwt
              stack_id: data.request.spacelift_stack
              run_id: data.run_info.run_id
        - switch:
            cases:
              - condition: data.run_status.data.stack.run.state == "FINISHED"
                steps:
                  - script:
                      output_key: ready
                      input_args:
                        outputs: data.run_status.data.stack.outputs
                        request: data.request
                        run_url: data.run_info.run_url
                      code: |
                        inv = ""
                        for o in (outputs or []):
                            if o.get("id") == "vm_inventory":
                                inv = str(o.get("value") or "")
                        if len(inv) >= 2 and inv[0] == '"' and inv[-1] == '"':
                            inv = inv[1:-1]
                        mine = None
                        for r in inv.split(";"):
                            f = r.split("|")
                            if len(f) >= 8 and f[0] == request.get("request_id"):
                                mine = f
                        if mine is None:
                            mine = [request.get("request_id"), request.get("hostname"), "n/a", "n/a", "", "", "", ""]
                        msg = ("Your VM is ready\n"
                               + "Host: " + mine[1] + "\n"
                               + "IP: " + mine[2] + "\n"
                               + "Instance: " + mine[3] + " (" + mine[6] + ")\n"
                               + "Requested: " + str(request.get("spec", "")) + "\n"
                               + "Lease: " + str(request.get("duration_days", "")) + " days\n"
                               + "Terraform run: " + str(run_url) + "\n"
                               + "Say \"show my VMs\" or \"delete " + mine[1] + "\" any time.")
                        {"message": msg, "hostname": mine[1], "ip_address": mine[2], "instance_id": mine[3]}
                  - action:
                      action_name: mw.batch_send_plaintext_chat_notification
                      output_key: notify_ready
                      input_args:
                        notifications:
                          - user_record_id: data.people.user_records[0].user.record_id
                            message: data.ready.message
                  - return:
                      output_mapper:
                        state: '"FINISHED"'
              - condition: data.run_status.data.stack.run.state == "FAILED" OR data.run_status.data.stack.run.state == "STOPPED" OR data.run_status.data.stack.run.state == "DISCARDED" OR data.run_status.data.stack.run.state == "CANCELED"
                steps:
                  - action:
                      action_name: mw.batch_send_plaintext_chat_notification
                      output_key: notify_failed
                      input_args:
                        notifications:
                          - user_record_id: data.people.user_records[0].user.record_id
                            message: data.request.msg_failed
                  - return:
                      output_mapper:
                        state: data.run_status.data.stack.run.state

  # ---------- loop ended: if the run isn't in a final state, say so ----------
  - action:
      action_name: spacelift_get_run
      output_key: final_status
      input_args:
        jwt: data.token.data.apiKeyUser.jwt
        stack_id: data.request.spacelift_stack
        run_id: data.run_info.run_id
  - switch:
      cases:
        - condition: data.final_status.data.stack.run.state != "FINISHED" AND data.final_status.data.stack.run.state != "FAILED" AND data.final_status.data.stack.run.state != "STOPPED" AND data.final_status.data.stack.run.state != "DISCARDED" AND data.final_status.data.stack.run.state != "CANCELED"
          steps:
            - action:
                action_name: mw.batch_send_plaintext_chat_notification
                output_key: notify_timeout
                input_args:
                  notifications:
                    - user_record_id: data.people.user_records[0].user.record_id
                      message: data.request.msg_timeout

  - return:
      output_mapper:
        request_id: data.request.request_id
        run_id: data.run_info.run_id
        run_url: data.run_info.run_url
        final_state: data.final_status.data.stack.run.state
